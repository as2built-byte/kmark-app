<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>K-MARK — Portale Aziendale</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-kmark.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme color (browser chrome) -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />

    <!-- iOS PWA — makes it act as a standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-MARK" />

    <!-- iOS touch icon (home screen icon) -->
    <link rel="apple-touch-icon" href="/logo-kmark.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-kmark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-kmark.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo-kmark.png" />

    <!-- iOS splash screens -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-startup-image" href="/logo-kmark.png" />

    <!-- Description for SEO / share -->
    <meta name="description" content="Portale aziendale K-MARK S.P.A — Timbratura, presenze, spese e documenti" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
